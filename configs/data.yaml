  revision: main
  base_url: https://media.githubusercontent.com/media/amazon-science/esci-data/main/shopping_queries_dataset
  examples_file: shopping_queries_dataset_examples.parquet
  products_file: shopping_queries_dataset_products.parquet
scope:
