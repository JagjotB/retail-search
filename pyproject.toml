[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-search-ranking"
version = "0.1.0"
description = "Reusable two-stage retail retrieval and learning-to-rank engine with an Amazon ESCI benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "joblib==1.5.2",
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "openvino==2026.3.1",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "rapidfuzz==3.14.6",
  "requests==2.32.5",
  "scikit-learn==1.7.1",
  "transformers==4.57.6",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "beautifulsoup4==4.13.5",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]
training = ["torch==2.8.0"]

[project.scripts]
retail-search = "retail_search.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_search = ["api/templates/*.html", "api/static/*.css", "api/static/*.js"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
